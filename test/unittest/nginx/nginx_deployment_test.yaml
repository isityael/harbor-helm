suite: NginxDeployment

tests:
  - it: UsesDefaultGhcrImageTag
    set:
      expose:
        type: nodePort
        tls:
          auto:
            commonName: 127.0.0.1
    template: templates/nginx/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/isityael/nginx-photon:v2.16.0-yael.5@sha256:4d0c518a9f8307427829aab16ce4f598d8435466e463148ca74e7d5ae46d5b57

  - it: UsesConfiguredImageTag
    set:
      expose:
        type: nodePort
        tls:
          auto:
            commonName: 127.0.0.1
      nginx:
        image:
          repository: test-repository/test-image
          tag: 1.0.0
    template: templates/nginx/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test-repository/test-image:1.0.0
