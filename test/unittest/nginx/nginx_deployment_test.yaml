suite: NginxDeployment

tests:
  - it: DefaultsImageTagToAppVersion
    set:
      expose:
        type: nodePort
        tls:
          auto:
            commonName: 127.0.0.1
    template: templates/nginx/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/goharbor/nginx-photon:v2.15.1

  - it: UsesConfiguredImageTag
    set:
      expose:
        type: nodePort
        tls:
          auto:
            commonName: 127.0.0.1
      nginx:
        image:
          repository: test-repository/test-image
          tag: 1.0.0
    template: templates/nginx/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test-repository/test-image:1.0.0
