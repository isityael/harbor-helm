# Harbor Helm chart — lint pipeline
#
# Runs on pushes to sm-moshi/main and pull requests.
when:
  - event: [push, pull_request]
    branch: sm-moshi/main

steps:
  - name: chart-version-guard
    image: ghcr.io/yaelmoshi/chart-version-guard:main@sha256:f40316a612975d534addcb8eb4fa7fc808fd0dfe146e8ce09826b2f6f8cde135
    commands:
      - chart-version-guard check --ci woodpecker --repo .

  - name: helm-lint
    image: dhi.io/helm:4.2.2-debian13-dev@sha256:ae4f1e9ee9845261b3d5bda238a952459249710c718b9b1449b28c27adedbbf1
    commands:
      - helm lint .

  - name: template-ingress
    image: dhi.io/helm:4.2.2-debian13-dev@sha256:ae4f1e9ee9845261b3d5bda238a952459249710c718b9b1449b28c27adedbbf1
    commands:
      - helm template harbor . --set "expose.type=ingress" > /dev/null

  - name: template-nodeport
    image: dhi.io/helm:4.2.2-debian13-dev@sha256:ae4f1e9ee9845261b3d5bda238a952459249710c718b9b1449b28c27adedbbf1
    commands:
      - helm template harbor . --set "expose.type=nodePort,expose.tls.auto.commonName=127.0.0.1" > /dev/null
