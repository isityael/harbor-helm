# Harbor Helm chart — release pipeline
#
# Triggered by version tags (v*). Packages the chart, pushes the OCI
# artifact to git.m0sh1.cc/isityael/charts.
#
# Release workflow:
#   1. Bump version/appVersion in Chart.yaml
#   2. Commit: "build: bump chart to vX.Y.Z / appVersion vA.B.C"
#   3. Tag:    git tag vX.Y.Z
#   4. Push:   git push && git push --tags
#   5. This pipeline runs automatically
when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: helm-lint
    image: dhi.io/helm:4.3.1-debian13-dev
    commands:
      - helm lint .

  - name: helm-package
    image: dhi.io/helm:4.3.1-debian13-dev
    environment:
      FORGEJO_USERNAME:
        from_secret: forgejo_public_package_username
      FORGEJO_TOKEN:
        from_secret: forgejo_public_package_token
    commands:
      - helm package .
      - helm registry login git.m0sh1.cc -u "$FORGEJO_USERNAME" -p "$FORGEJO_TOKEN"
      - helm push harbor-*.tgz oci://git.m0sh1.cc/isityael/charts
