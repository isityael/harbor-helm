# Harbor Helm chart — release pipeline
#
# Triggered by version tags (v*). Packages the chart, pushes the OCI
# artifact to ghcr.io/isityael/charts, and creates a GitHub release.
#
# Release workflow:
#   1. Bump version/appVersion in Chart.yaml
#   2. Commit: "build: bump chart to vX.Y.Z / appVersion vA.B.C"
#   3. Tag:    git tag vX.Y.Z
#   4. Push:   git push && git push --tags
#   5. This pipeline runs automatically
when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: helm-lint
    image: dhi.io/helm:4.2.2-debian13-dev@sha256:fa12911c5acb25f48cbe4d6a5d271e0a69fa0193cf9c2948e3788f59ad47d566
    commands:
      - helm lint .

  - name: helm-package
    image: dhi.io/helm:4.2.2-debian13-dev@sha256:fa12911c5acb25f48cbe4d6a5d271e0a69fa0193cf9c2948e3788f59ad47d566
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - helm package .
      - helm registry login ghcr.io -u "$GHCR_USERNAME" -p "$GHCR_TOKEN"
      - helm push harbor-*.tgz oci://ghcr.io/isityael/charts

  - name: github-release
    image: dhi.io/alpine-base:3.24-dev@sha256:74230b37711de2e5cbc42b8fbd0bb019417ce99b05e5792390d75cb6c948a560
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache github-cli
      - |
        test -n "$GITHUB_TOKEN" || { echo "Missing github_token secret"; exit 1; }
        export GH_TOKEN="${GITHUB_TOKEN}"
        REPO="isityael/harbor-helm"
        ARTIFACT="harbor-${CI_COMMIT_TAG#v}.tgz"

        test -f "$ARTIFACT" || { echo "Missing chart package: $ARTIFACT"; exit 1; }
        sha256sum "$ARTIFACT" > SHA256sum.txt
        gh api "repos/${REPO}/git/refs" \
          -f ref="refs/tags/${CI_COMMIT_TAG}" \
          -f sha="${CI_COMMIT_SHA}" >/dev/null 2>&1 || true

        if gh release view "${CI_COMMIT_TAG}" --repo "$REPO" >/dev/null 2>&1; then
          gh release edit "${CI_COMMIT_TAG}" --repo "$REPO" --title "${CI_COMMIT_TAG}" --notes "auto" --draft=false --prerelease=false
        else
          gh release create "${CI_COMMIT_TAG}" --repo "$REPO" --title "${CI_COMMIT_TAG}" --notes "auto" --draft=false --prerelease=false --verify-tag
        fi

        gh release upload "${CI_COMMIT_TAG}" --repo "$REPO" "$ARTIFACT" SHA256sum.txt --clobber
