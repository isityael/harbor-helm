# Harbor Helm chart — release pipeline
#
# Triggered by version tags (v*). Packages the chart, pushes the OCI
# artifact to ghcr.io/sm-moshi/charts, and creates a GitHub release.
#
# Release workflow:
#   1. Bump version/appVersion in Chart.yaml
#   2. Commit: "build: bump chart to vX.Y.Z / appVersion vA.B.C"
#   3. Tag:    git tag vX.Y.Z
#   4. Push:   git push && git push --tags
#   5. This pipeline runs automatically
when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: helm-lint
    image: dhi.io/helm:4.1.4-debian13-dev@sha256:512a0baf6b24e133df0745005bddca5f34f47203a6ae9de1443f6b808ca03d2d
    commands:
      - helm lint .

  - name: helm-package
    image: dhi.io/helm:4.1.4-debian13-dev@sha256:512a0baf6b24e133df0745005bddca5f34f47203a6ae9de1443f6b808ca03d2d
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - helm package .
      - helm registry login ghcr.io -u "$GHCR_USERNAME" -p "$GHCR_TOKEN"
      - helm push harbor-*.tgz oci://ghcr.io/sm-moshi/charts

  - name: github-release
    image: woodpeckerci/plugin-release@sha256:dd4ee2205655310d165afba0ae41a1f946cdb028ad14e96c4da7b035cfa8b768
    settings:
      api_key:
        from_secret: github_token
      base_url: https://api.github.com
      files:
        - "harbor-*.tgz"
      checksum:
        - sha256
      title: "${CI_COMMIT_TAG}"
      note: "auto"
      draft: false
