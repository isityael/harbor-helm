# Harbor Helm chart — release pipeline
#
# Triggered by version tags (v*). Packages the chart, pushes the OCI
# artifact to ghcr.io/sm-moshi/charts, and creates a GitHub release.
#
# Release workflow:
#   1. Bump version/appVersion in Chart.yaml
#   2. Commit: "build: bump chart to vX.Y.Z / appVersion vA.B.C"
#   3. Tag:    git tag vX.Y.Z
#   4. Push:   git push && git push --tags
#   5. This pipeline runs automatically
when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: helm-lint
    image: dhi.io/helm:4.1.3-debian13-dev@sha256:0e15ecf570c1d5e2348d934b5ea4c41134d641e7ae43831b84e774b73cfdb88b
    commands:
      - helm lint .

  - name: helm-package
    image: dhi.io/helm:4.1.3-debian13-dev@sha256:0e15ecf570c1d5e2348d934b5ea4c41134d641e7ae43831b84e774b73cfdb88b
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - helm package .
      - helm registry login ghcr.io -u "$GHCR_USERNAME" -p "$GHCR_TOKEN"
      - helm push harbor-*.tgz oci://ghcr.io/sm-moshi/charts

  - name: github-release
    image: woodpeckerci/plugin-release@sha256:284b6120fccc21067d6ae5280f4ecee276c294b8de9907c2d167c8884a4d1f25
    settings:
      api_key:
        from_secret: github_token
      base_url: https://api.github.com
      files:
        - "harbor-*.tgz"
      checksum:
        - sha256
      title: "${CI_COMMIT_TAG}"
      note: "auto"
      draft: false
