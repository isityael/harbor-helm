name: Lint

on:
  pull_request:
  push:
    branches:
      - sm-moshi/main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint .

      - name: Template (ingress)
        run: helm template harbor . --set "expose.type=ingress" > /dev/null

      - name: Template (nodePort)
        run: helm template harbor . --set "expose.type=nodePort,expose.tls.auto.commonName=127.0.0.1" > /dev/null
