name: Create chart release tag

on:
  push:
    branches: [isityael/main]
    paths:
      - Chart.yaml
      - values.yaml
      - values.schema.json
      - templates/**
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create immutable chart tag
        env:
          FORGEJO_API_URL: ${{ github.server_url }}/api/v1
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ./hack/wait-for-woodpecker-success.sh "${GITHUB_SHA}" ci/woodpecker/push/lint
          CHART_VERSION="$(sed -n 's/^version:[[:space:]]*//p' Chart.yaml | head -n 1)"
          case "${CHART_VERSION}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid chart version: ${CHART_VERSION}" >&2; exit 1 ;;
          esac
          if existing="$(curl --fail --silent --show-error \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/git/refs/tags/v${CHART_VERSION}")"; then
            target="$(printf '%s' "$existing" | jq -r '.object.sha')"
            if [ "$target" = "$GITHUB_SHA" ]; then
              echo "v${CHART_VERSION} already releases ${GITHUB_SHA}"
              exit 0
            fi
            echo "v${CHART_VERSION} already exists at ${target}; refusing to move it" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"tag_name\":\"v${CHART_VERSION}\",\"target\":\"${GITHUB_SHA}\"}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/tags"
